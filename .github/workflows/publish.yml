name: publish (npm)
# Publishes @x402jp/delivery-receipt-verify and -seller from main: any package whose version in
# package.json is not on npm yet is published (verify first: seller depends on it). Bump the
# version in a PR; merging it publishes. Tags v* also run it.
# Published through npm Trusted Publishing (GitHub Actions OIDC): no token. Each package must
# list this repository and publish.yml as its Trusted Publisher on npmjs.com.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # npm provenance
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.10.0 # Trusted Publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Publish versions not on npm yet
        run: |
          for p in packages/verify packages/seller; do
            name=$(node -p "require('./$p/package.json').name")
            version=$(node -p "require('./$p/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
            else
              npm publish -w "$p" --access public
            fi
          done
